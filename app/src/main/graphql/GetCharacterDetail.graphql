query GetCharacterDetail($characterId: Int!) {
    Character(id: $characterId) {
        id
        name {
            native
            full
        }
        image {
            large
            medium
        }
        gender
        dateOfBirth {
            month
            day
        }
        age
        bloodType
        description(asHtml: false)
        media(page: 1, perPage: 20, sort: [POPULARITY_DESC]) {
            edges {
                characterRole
                voiceActors(language: JAPANESE, sort: [RELEVANCE, ID]) {
                    id
                    name {
                        native
                        full
                    }
                    image {
                        large
                        medium
                    }
                    languageV2
                }
                node {
                    id
                    type
                    title {
                        native
                        romaji
                        english
                    }
                    coverImage {
                        large
                        medium
                    }
                    weightedScore
                }
            }
        }
    }
}