query GetAnimeDetail($animeId: Int!, $mediaType: MediaType!) {
    Media(id: $animeId, type: $mediaType) {
        id
        type
        status
        title {
            native
            romaji
            english
        }
        coverImage {
            large
            medium
        }
        relations {
            edges {
                relationType(version: 2)
                node {
                    id
                    type
                    format
                    volumes
                    chapters
                    title {
                        native
                        romaji
                        english
                    }
                    coverImage {
                        large
                        medium
                    }
                    weightedScore
                }
            }
        }
        description(asHtml: false)
        weightedScore
        episodes
        volumes
        chapters
        seasonYear
        genres
        trailer {
            id
            site
            thumbnail
        }
    }
}